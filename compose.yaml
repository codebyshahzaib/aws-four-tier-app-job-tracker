services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: job_tracker
      POSTGRES_USER: job_tracker
      POSTGRES_PASSWORD: local-dev-only
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U job_tracker -d job_tracker"], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 5}
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://job_tracker:local-dev-only@db:5432/job_tracker
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports: ["8000:8000"]
    depends_on: {init-db: {condition: service_completed_successfully}, redis: {condition: service_healthy}}
    volumes: [uploads:/app/uploads]
    restart: unless-stopped
  init-db:
    build: ./backend
    command: ["python", "-m", "app.init_db"]
    environment:
      DATABASE_URL: postgresql+psycopg://job_tracker:local-dev-only@db:5432/job_tracker
    depends_on: {db: {condition: service_healthy}}
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://job_tracker:local-dev-only@db:5432/job_tracker
    depends_on: {init-db: {condition: service_completed_successfully}}
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: {api: {condition: service_started}}
volumes:
  postgres-data:
  uploads:
